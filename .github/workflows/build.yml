name: Build Windows exe

on:
  push:
    tags: ["v*"]        # 推送 v1.0.0 这类 tag 时自动打包并发布 Release
  workflow_dispatch:    # 也可以在 Actions 页面手动运行

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name SpotifyLyrics
          --icon icon.ico
          --add-data "icon.ico;."
          --collect-all winsdk
          spotify_lyrics.py

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyLyrics-${{ env.APP_VERSION }}
          path: |
            dist/SpotifyLyrics.exe
            dist/SpotifyLyrics-Setup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SpotifyLyrics.exe
            dist/SpotifyLyrics-Setup-*.exe
